server {
    listen       80;
    server_name  localhost;

    # Excel / Kora / NFBC extraction service
    location /excel-extraction/ {
        resolver 127.0.0.11 valid=10s; # Docker DNS resolver

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50m;
        proxy_read_timeout 600s; # extraction can be slow

        proxy_pass http://$EXTRACTOR_HOST/;
    }

    location / {
        resolver 127.0.0.11 valid=10s; # Docker DNS resolver

        set $should_proxy 1;

        # Large quota for metadata
        client_max_body_size 100m;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Client html
        if ($http_accept ~ '(text/html)') {
            set $should_proxy 0;
        }

        # Client assets
        if ($request_uri ~ '(\.css)|(\.png)|(\.js)|(\.ico)$') {
            set $should_proxy 0;
        }

        # RDF API
        if ($request_uri ~ '(\?format=(.+))$') {
            set $should_proxy 1;
        }

        # Swagger
        if ($request_uri ~ '^(/swagger-ui\.html)|(/swagger-ui/)|(/v3/api-docs)') {
            set $should_proxy 1;
        }

        # Swagger assets
        if ($request_uri ~ '^(/webjars)') {
            set $should_proxy 1;
        }

        if ($should_proxy) {
            proxy_pass http://$FDP_HOST;
            break;
        }

        root   /usr/share/nginx/html;
        add_header  Last-Modified "";
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    error_page 404 =200 /index.html;
}
